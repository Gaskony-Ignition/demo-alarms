# A throwaway Ignition EDGE gateway for this demo, and nothing else.
#
# It exists because "runs on Edge" is a claim about a platform that behaves
# differently in ways no standard gateway can reproduce: no database module at
# all, exactly one realtime tag provider, one platform-owned alarm journal, and
# a hard cap on concurrent Perspective sessions.
#
# The image is the SAME one the standard rig uses - the edition is chosen at
# commissioning, not by a tag or an environment variable. `tools/commission.js`
# presses that button headlessly; see docs/EDGE.md.
#
# Explicit project name - without it Compose uses the DIRECTORY name (`edge`),
# which is generic enough to collide with another stack's container.
name: alarmdemo-edge

services:
  edge:
    image: inductiveautomation/ignition:8.3.8
    container_name: alarmdemo-edge
    ports:
      - "8588:8088"
      - "8589:8043"
    volumes:
      - edge-data:/usr/local/bin/ignition/data
    environment:
      - ACCEPT_IGNITION_EULA=Y
      - GATEWAY_ADMIN_USERNAME=admin
      - GATEWAY_ADMIN_PASSWORD=password
      # glibc hands a process up to 8 x cores malloc arenas and Ignition
      # spreads ~220 threads across all of them, so RSS runs far above the
      # heap. Capping arenas is where most of the saving is.
      - MALLOC_ARENA_MAX=2
    command: >
      -n alarmdemo-edge
      -m 1024
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/StatusPing"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

volumes:
  edge-data:
